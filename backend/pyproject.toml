[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "BLE001",  # Allow catching broad Exception at service boundaries
    "TRY201",  # Allow raise e
    "E501",    # Line too long
    "F841",    # Local variable is assigned to but never used
]
