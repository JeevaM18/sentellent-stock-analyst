name: Backend CI/CD & AWS Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "terraform/**"
      - ".github/workflows/deploy-backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "terraform/**"

  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: sentellent-cluster
  ECS_SERVICE: Sentellent-Production-backend-service
  ECR_REPOSITORY: sentellent-production-backend

jobs:

  verify:
    name: Backend Verification
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Ruff Lint
        run: |
          cd backend
          ruff check . --exit-zero

      - name: Run Unit Tests
        run: |
          cd backend
          pytest tests/

      - name: Docker Build Verification
        run: |
          docker build -t sentellent-backend-test ./backend

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Configure AWS Credentials
        if: github.event_name == 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Validation
        if: github.event_name == 'pull_request'
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_google_api_key: ${{ secrets.GOOGLE_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
        run: |
          cd terraform

          terraform init

          terraform fmt -check

          terraform validate

          terraform plan

  deploy:

    name: Deploy to AWS ECS
    needs: verify

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    timeout-minutes: 45

    environment:
      name: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Apply
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_google_api_key: ${{ secrets.GOOGLE_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
          TF_VAR_backend_image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          cd terraform

          terraform init

          terraform apply -auto-approve

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for ECS Service
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      - name: Get Application URL
        id: alb
        run: |
          cd terraform
          echo "ALB_URL=$(terraform output -raw alb_dns)" >> $GITHUB_ENV

      - name: Health Check
        run: |
          curl --retry 10 \
               --retry-delay 15 \
               --retry-all-errors \
               http://$ALB_URL/health

      - name: Deployment Summary
        run: |
          echo "======================================="
          echo "Deployment Successful"
          echo "======================================="
          echo "Application:"
          echo "http://$ALB_URL"
          echo ""
          echo "Backend:"
          echo "http://$ALB_URL/docs"
          echo ""
          echo "Health:"
          echo "http://$ALB_URL/health"